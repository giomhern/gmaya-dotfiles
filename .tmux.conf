# List of plugins
# Press 'C-a' + 'I' (capital i, as in Install) to install the plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# NOTE: American spelling. catppuccin/tmux v2 reads @catppuccin_flavor;
# @catppuccin_flavour is silently ignored and you get the mocha default.
set -g @catppuccin_flavor "mocha"

set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number_color "#{@thm_blue}"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"

set -g status-right "#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}"
set -g status-left ""
set -g status-right-length 100
set -g status-left-length 100
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "no"

# Menu box styling for the kill confirmations further down. Hardcoded mocha
# hexes rather than "#{@thm_*}" because those are only defined once catppuccin
# has loaded, and tpm loads it asynchronously from the bottom of this file.
# Same reason .zshrc spells out the palette for fzf.
set -g menu-style "fg=#cdd6f4,bg=#181825"
set -g menu-border-style "fg=#6c7086"
set -g menu-border-lines rounded

set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_last " 󰖰"
set -g @catppuccin_window_flags_icon_current " 󰖯"
set -g @catppuccin_window_flags_icon_zoom " 󰁌"
set -g @catppuccin_window_flags_icon_mark " 󰃀"
set -g @catppuccin_window_flags_icon_silent " 󰂛"
set -g @catppuccin_window_flags_icon_activity " 󱅫"
set -g @catppuccin_window_flags_icon_bell " 󰂞"

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Basics
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -g escape-time 10
set -g history-limit 20000
# Let escape sequences reach the terminal (OSC52 clipboard over SSH, images).
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#W"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
# Closing a session drops you into another one instead of back to the shell.
set -g detach-on-destroy off

# Prefer vi style key table
setw -g mode-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'Escape' send -X cancel
# Mouse drag copies without snapping the view back to the prompt.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# Mouse support
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Reload the config file
unbind r
bind r source-file ~/.tmux.conf \; display-message "config-reloaded"

# Name windows after the directory they're in. Beats the blocking rename prompt
# that used to fire on every after-new-window (it also fired during resurrect
# restores). Override any single window with "prefix ,".
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# Open new window/pane in the current directory. "|" and "-" are the mnemonic
# splits; the default '"' and "%" still work.
bind c new-window -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Resize the active pane with prefix + shift-arrows, repeatable (hold shift and
# keep tapping). Mirrors the plain shift-arrow resize nvim uses inside a pane.
bind -r S-Left  resize-pane -L 5
bind -r S-Down  resize-pane -D 3
bind -r S-Up    resize-pane -U 3
bind -r S-Right resize-pane -R 5

# Repeatable window cycling, so prefix + n/p can be held down.
bind -r n next-window
bind -r p previous-window

# Kill confirmations as a centred menu rather than "confirm-before", which
# commandeers the status line and parks the cursor next to the window name.
# "y" still confirms; Esc or "n" backs out. The menu styling is below.
bind x display-menu -T "#[align=centre fg=#f38ba8,bold] kill pane " -x C -y C \
  " Yes"    y kill-pane \
  " Cancel" n ""
bind & display-menu -T "#[align=centre fg=#f38ba8,bold] kill window " -x C -y C \
  " Yes"    y kill-window \
  " Cancel" n ""

# Alt-t toggles a floating scratch session. Not Ctrl-T: that is bound at the
# root table, so it never reaches the pane, and both nvim's file explorer
# (open-in-new-tab) and fzf's file widget need it.
# TMUX= is required — attaching from inside a tmux client is refused otherwise.
bind -n M-t if-shell -F '#{==:#{session_name},popup}' \
  { detach-client } \
  { display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "TMUX= tmux new-session -A -s popup" }

# Pane navigation is "prefix + arrows" (a tmux default, repeatable). There used
# to be a no-prefix ctrl+arrow binding here that forwarded the key to nvim when
# the pane was running it, so one keystroke crossed nvim splits and tmux panes.
# It cannot work on macOS: the window server claims ctrl+arrows for Mission
# Control and space switching before any terminal sees them. Inside nvim, use
# "Ctrl-w" + h/j/k/l or arrows to move between splits.

# Session persistence. continuum autosaves every 15m and restores on server
# start; resurrect brings back panes, layouts, cwds and (below) running programs.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
