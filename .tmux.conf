# List of plugins
# Press 'C-a' + 'I' (capital i, as in Install) to install the plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Shared palette. theme.sh updates these colors and the marker together.
set -g @gmaya_theme "latte"
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#4c4f69,bg=#e6e9ef"
set -g status-left "#[fg=#e6e9ef,bg=#1e66f5,bold] #S #[fg=#1e66f5,bg=#e6e9ef,nobold]"
set -g status-right "#[fg=#4c4f69,bg=#e6e9ef]#{prefix_highlight}  %H:%M  #[fg=#e6e9ef,bg=#1e66f5,bold] #h "
set -g status-right-length 100
set -g status-left-length 100
setw -g window-status-separator " "
setw -g window-status-style "fg=#8c8fa1,bg=#e6e9ef"
setw -g window-status-format " #I #W #F "
setw -g window-status-current-format "#[fg=#8839ef,bg=#ccd0da,bold] #I #W #F #[fg=#4c4f69,bg=#e6e9ef,nobold]"
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#1e66f5"
set -g message-style "fg=#1e66f5,bg=#ccd0da"
set -g mode-style "fg=#eff1f5,bg=#1e66f5"
set -g @prefix_highlight_fg '#eff1f5'
set -g @prefix_highlight_bg '#df8e1d'
set -g @prefix_highlight_prefix_prompt ' PREFIX '
set -g @prefix_highlight_show_copy_mode 'on'

# Menu box styling for the kill confirmations further down.
set -g menu-style "fg=#4c4f69,bg=#e6e9ef"
set -g menu-border-style "fg=#9ca0b0"
set -g menu-border-lines rounded

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Basics
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -g escape-time 10
set -g history-limit 20000
# Let escape sequences reach the terminal (OSC52 clipboard over SSH, images).
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#W"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
# Closing a session drops you into another one instead of back to the shell.
set -g detach-on-destroy off

# Nothing here re-fits windows on attach. "resize-window -A" hooks look like the
# cure for tmux's dotted filler, but -A flips the window to "window-size manual"
# for good, so the next terminal resize strands it at the pinned size. The dots
# came from continuum's restore-on-start replaying a stale layout; with that gone
# the default "window-size latest" fits each window on its own. If a manual
# restore ever leaves dots behind: set -uw window-size on that window.

# Prefer vi style key table
setw -g mode-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'Escape' send -X cancel
# Mouse drag copies without snapping the view back to the prompt.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# Mouse support
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Reload the config file
unbind r
bind r source-file ~/.tmux.conf \; display-message "config-reloaded"

# Name windows after the directory they're in. Beats the blocking rename prompt
# that used to fire on every after-new-window (it also fired during resurrect
# restores). Override any single window with "prefix ,".
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# Open new window/pane in the current directory. "|" and "-" are the mnemonic
# splits; the default '"' and "%" still work.
bind c new-window -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Resize the active pane with prefix + shift-arrows, repeatable (hold shift and
# keep tapping). Mirrors the plain shift-arrow resize nvim uses inside a pane.
bind -r S-Left  resize-pane -L 5
bind -r S-Down  resize-pane -D 3
bind -r S-Up    resize-pane -U 3
bind -r S-Right resize-pane -R 5

# Repeatable window cycling, so prefix + n/p can be held down.
bind -r n next-window
bind -r p previous-window

# Kill confirmations as a centred menu rather than "confirm-before", which
# commandeers the status line and parks the cursor next to the window name.
# "y" still confirms; Esc or "n" backs out. The menu styling is below.
bind x display-menu -T "#[align=centre fg=#d20f39,bold] kill pane " -x C -y C \
  " Yes"    y kill-pane \
  " Cancel" n ""
bind & display-menu -T "#[align=centre fg=#d20f39,bold] kill window " -x C -y C \
  " Yes"    y kill-window \
  " Cancel" n ""

# Alt-t toggles a floating scratch session. Not Ctrl-T: that is bound at the
# root table, so it never reaches the pane, and both nvim's file explorer
# (open-in-new-tab) and fzf's file widget need it.
# TMUX= is required — attaching from inside a tmux client is refused otherwise.
bind -n M-t if-shell -F '#{==:#{session_name},popup}' \
  { detach-client } \
  { display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "TMUX= tmux new-session -A -s popup" }

# Pane navigation is "prefix + arrows" (a tmux default, repeatable). There used
# to be a no-prefix ctrl+arrow binding here that forwarded the key to nvim when
# the pane was running it, so one keystroke crossed nvim splits and tmux panes.
# It cannot work on macOS: the window server claims ctrl+arrows for Mission
# Control and space switching before any terminal sees them. Inside nvim, use
# "Ctrl-w" + h/j/k/l or arrows to move between splits.

# Session persistence, on demand only: "prefix C-s" saves, "prefix C-r" restores
# panes, layouts, cwds and running programs. continuum used to autosave every
# 15m and restore on server start; both are gone, so a fresh server stays fresh.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Machine-specific styling belongs here. The file is ignored by Git and loads
# after the shared theme so local colors and separators win.
source-file -q ~/.tmux.conf.local

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
