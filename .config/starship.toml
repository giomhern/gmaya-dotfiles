"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "[▌](blue) $username$directory$git_branch$git_status$character"
right_format = "$status$time"

palette = 'oxocarbon_dark'

[palettes.oxocarbon_dark]
rosewater = "#ffb3d6"
flamingo = "#ff7eb6"
pink = "#ee5396"
mauve = "#be95ff"
red = "#fa4d56"
maroon = "#da1e28"
peach = "#ff832b"
yellow = "#f1c21b"
green = "#42be65"
teal = "#08bdba"
sky = "#3ddbd9"
sapphire = "#82cfff"
blue = "#78a9ff"
lavender = "#a6c8ff"
text = "#f2f4f8"
subtext1 = "#dde1e6"
subtext0 = "#c1c7cd"
overlay2 = "#8d8d8d"
overlay1 = "#6f6f6f"
overlay0 = "#525252"
surface2 = "#393939"
surface1 = "#303030"
surface0 = "#262626"
base = "#161616"
mantle = "#1f1f1f"
crust = "#0f0f0f"

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = false
style_user = "fg:overlay1"
style_root = "fg:red"
format = '[$user@]($style)'

[directory]
style = "fg:text"
format = "[$path]($style)"
truncation_length = 10
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
symbol = ""
style = "fg:blue"
format = ' [$symbol $branch]($style)'

[git_status]
style = "fg:teal"
format = ' [$all_status$ahead_behind]($style)'

[character]
success_symbol = '[ ❯ ](fg:teal)'
error_symbol = '[ ❯ ](fg:red)'
vimcmd_symbol = '[ ❮ ](fg:blue)'

[status]
disabled = false
style = 'fg:overlay1'
failure_style = 'fg:red'
success_style = 'fg:green'
success_symbol = ""
symbol = ""
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = ""
signal_symbol = ""
format = '[$symbol $status ]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay1"
format = '[ $time]($style)'
