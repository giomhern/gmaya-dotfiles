"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$username$directory$git_branch$git_status$character"
right_format = "$status$time"

palette = 'tokyonight_moon'

[palettes.tokyonight_moon]
rosewater = "#fca7ea"
flamingo = "#c099ff"
pink = "#ff007c"
mauve = "#b4f9f8"
red = "#ff757f"
maroon = "#c53b53"
peach = "#ff966c"
yellow = "#ffc777"
green = "#c3e88d"
teal = "#4fd6be"
sky = "#86e1fc"
sapphire = "#65bcff"
blue = "#82aaff"
lavender = "#89ddff"
text = "#c8d3f5"
subtext1 = "#737aa2"
subtext0 = "#828bb8"
overlay2 = "#636da6"
overlay1 = "#545c7e"
overlay0 = "#444a73"
surface2 = "#3b4261"
surface1 = "#394b70"
surface0 = "#2d3f76"
base = "#222436"
mantle = "#1e2030"
crust = "#191B29"

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = false
style_user = "subtext0"
style_root = "bold red"
format = '[$user]($style) '

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 10
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
symbol = ""
style = "mauve"
format = '[$symbol $branch]($style) '

[git_status]
style = "yellow"
format = '[$all_status$ahead_behind]($style) '

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[status]
disabled = false
style = "red"
success_style = "green"
success_symbol = ""
symbol = ""
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = ""
signal_symbol = ""
format = '[$symbol $status]($style) '

[time]
disabled = false
time_format = "%H:%M"
style = "subtext0"
format = '[$time]($style)'
