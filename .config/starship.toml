"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "[█](surface0)$os$username[](bg:blue fg:surface0)$directory[](fg:blue bg:green)$git_branch$git_status[](fg:green) "
right_format = "[](fg:surface0)$status[](bg:surface0 fg:text)$time"

palette = 'rose_pine_dawn'

[palettes.rose_pine_dawn]
rosewater = "#e5aaa0"
flamingo = "#d7827e"
pink = "#c27394"
mauve = "#907aa9"
red = "#b4637a"
maroon = "#a74e68"
peach = "#dc8c5a"
yellow = "#ea9d34"
green = "#6d8f89"
teal = "#286983"
sky = "#6aaab2"
sapphire = "#438797"
blue = "#56949f"
lavender = "#a18bb4"
text = "#575279"
subtext1 = "#66617e"
subtext0 = "#797593"
overlay2 = "#89859b"
overlay1 = "#9893a5"
overlay0 = "#b7b0b8"
surface2 = "#cecacd"
surface1 = "#dfdad9"
surface0 = "#f4ede8"
base = "#faf4ed"
mantle = "#f8f0e7"
crust = "#ece4dc"

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:text"
format = '[ $user ]($style)'

[directory]
style = "fg:mantle bg:blue"
format = "[ $path ]($style)"
truncation_length = 10
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
symbol = ""
style = "bg:teal"
format = '[[ $symbol $branch ](fg:base bg:green)]($style)'

[git_status]
style = "bg:teal"
format = '[[($all_status$ahead_behind )](fg:base bg:green)]($style)'

[status]
disabled = false
style = 'bg:surface0'
failure_style = 'bg:surface0 fg:red'
success_style = 'bg:surface0 fg:green'
success_symbol = ""
symbol = ""
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = ""
signal_symbol = ""
format = '[ $symbol $status ]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "bg:blue"
format = '[[  $time ](fg:text bg:surface0)]($style)'
